<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard & Buddy Club</title>
    
    <!-- ดึง Font ให้แสดงผลภาษาไทยสวยๆ บนมือถือ -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">

    <style>
      /* --- ใส่โค้ด CSS ใหม่ตรงนี้ --- */
      * { box-sizing: border-box; }
      body { 
        font-family: 'Kanit', sans-serif; 
        margin: 0; 
        padding-bottom: 90px; 
        background: #f8f9fa; 
        color: #2d3436;
        -webkit-tap-highlight-color: transparent;
      }

      .page { 
        display: none; 
        padding: 20px 15px; 
        max-width: 500px; 
        margin: 0 auto; 
        animation: fadeIn 0.3s ease-out;
      }
      .page.active { display: block; }

      .grid { 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); 
        gap: 12px; 
      }
        
.member-card { 
    background: #ffffff; 
    padding: 18px 12px; 
    border-radius: 20px; 
    text-align: center; 
    box-shadow: 0 6px 15px rgba(0,0,0,0.06); 
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 170px;
    position: relative;
    border: 2px solid transparent; /* เตรียมไว้ใส่สีตามเกม */
    transition: 0.3s;
}

/* สีสำหรับการ์ด Vanguard (เน้นโทนน้ำเงิน) */
.card-vanguard { 
    border-color: #007bff; 
    background: linear-gradient(180deg, #ffffff 70%, #e7f3ff 100%);
}
.card-vanguard img { border: 3px solid #007bff; }
.card-vanguard .badge { background: #007bff; color: white; }

/* สีสำหรับการ์ด Buddyfight (เน้นโทนแดง/ทอง) */
.card-buddy { 
    border-color: #ff4757; 
    background: linear-gradient(180deg, #ffffff 70%, #fff1f2 100%);
}
.card-buddy img { border: 3px solid #ff4757; }
.card-buddy .badge { background: #ff4757; color: white; }

/* สไตล์ตัวหนังสือและป้ายกำกับ */
.member-card img { 
    width: 75px; height: 75px; 
    border-radius: 50%; 
    object-fit: cover; 
    margin-bottom: 12px;
    background: #eee;
}
.member-card b { font-size: 16px; color: #2d3436; display: block; margin-bottom: 5px; }
.member-card .deck-name { font-size: 12px; color: #636e72; margin-bottom: 8px; }
.member-card .badge { 
    font-size: 10px; 
    padding: 2px 10px; 
    border-radius: 20px; 
    font-weight: 600; 
    text-transform: uppercase;
}
.member-card small { 
    font-size: 12px;
    color: #636e72;
    background: #f1f2f6; /* ใส่พื้นหลังอ่อนๆ ให้ชื่อเด็ค */
    padding: 2px 8px;
    border-radius: 10px;
    display: inline-block;
}

      input, select, button { 
        width: 100%; 
        padding: 14px; 
        margin: 8px 0; 
        border-radius: 12px; 
        border: 1px solid #e2e8f0; 
        font-size: 16px; 
        outline: none;
      }

      button[type="submit"] { 
        background: #007bff; 
        color: white; 
        font-weight: 600; 
        border: none; 
        margin-top: 15px;
        cursor: pointer;
      }

      .bottom-nav { 
        position: fixed; 
        bottom: 0; 
        width: 100%; 
        background: #ffffff; 
        display: flex; 
        box-shadow: 0 -4px 15px rgba(0,0,0,0.08); 
        padding-bottom: env(safe-area-inset-bottom);
        z-index: 1000;
      }
      .bottom-nav button { 
        flex: 1; 
        border: none; 
        background: none; 
        padding: 12px 5px; 
        font-size: 10px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        color: #a0aec0;
        margin: 0;
      }
      .bottom-nav button span { margin-top: 4px; font-weight: 500; }

      table { 
        width: 100%; 
        border-collapse: separate; 
        border-spacing: 0; 
        background: white;
        border-radius: 12px;
        overflow: hidden;
      }
      th { background: #007bff; color: white; padding: 12px; }
      td { padding: 12px; text-align: center; border-bottom: 1px solid #f1f5f9; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
        .full-screen-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* อยู่หลังสุด */
    
    background-image: url('https://cms.dmpcdn.com/moviearticle/2022/12/02/355fb770-7232-11ed-af87-33577e5a27b1_webp_original.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.2; /* ปรับจางตามชอบ */
}
/* ก๊อบปี้ส่วนนี้ไปวางใน <style> */
.home-banner {
    width: 90%;
    max-width: 350px;
    margin: 20px auto;
    background: white; /* หรือใช้สีพื้นหลังเดิมของคุณ */
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
}

.home-banner img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 15px;
}

    </style>
</head>

<body>
<div id="app">
  <!-- ส่วนแสดงเนื้อหา (จะเปลี่ยนไปตามเมนู) -->
  <main id="content">
    <div id="home" class="page active" style="text-align: center; padding-top: 40px;">
  <!-- ข้อความต้อนรับอยู่ด้านบน -->
  <h1 style="font-size: 26px; color: #333; margin-bottom: 5px;">🎴 Vanguard & Buddy Club</h1>
  <p style="font-size: 16px; color: #666;">ยินดีต้อนรับสู่ระบบบันทึกคะแนนชุมนุม</p>

  <!-- 1. กล่องสำหรับทำพื้นหลังเต็มจอ -->
<div class="full-screen-bg"></div>

<!-- 2. ส่วนแบนเนอร์อันเดิม (ไม่ต้องลบ) -->
<div class="home-banner">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvsCNJnzqcZ2nMCwWyj1HH3xwRhanhIEPfnw&s" alt="Club Banner" alt="Club Banner">
</div>

<p style="margin-top: 25px; color: #aaa; font-size: 14px;">เลือกเมนูด้านล่างเพื่อเริ่มต้น ⚔️</p>
 
</div>

    <!-- หน้าสมาชิก + ฟอร์มสมัคร -->
    <div id="members" class="page">
      <h2>👥 สมาชิกชุมนุม</h2>
      <div id="member-list" class="grid"></div>
      <hr>
      <h3>📝 สมัครสมาชิกใหม่</h3>
      <form id="regForm">
        <input type="text" id="fname" placeholder="ชื่อ-นามสกุล" required>
        <input type="text" id="grade" placeholder="ชั้น (เช่น ม.4/1)" required>
        <input type="number" id="no" placeholder="เลขที่" required>
        <select id="gameType">
          <option value="Vanguard">Vanguard</option>
          <option value="Buddyfight">Buddyfight</option>
        </select>
        <input type="text" id="deckName" placeholder="ชื่อเด็ค" required>
        <label>รูปโปรไฟล์:</label>
        <input type="file" id="userImg" accept="image/*">
        <label>รูปเด็ค:</label>
        <input type="file" id="deckImg" accept="image/*">
        <button type="submit">สมัครสมาชิก</button>
      </form>
    </div>

    <!-- หน้าบันทึกผล -->
    <!-- หน้าบันทึกผล -->
<div id="record" class="page">
  <h2>⚔️ บันทึกผลการแข่ง</h2>
  <form id="matchForm">
    <div class="input-group">
      <label>เลือกเกมที่เล่น:</label>
      <select id="matchGameType">
        <option value="Vanguard">Cardfight!! Vanguard</option>
        <option value="Buddyfight">Future Card Buddyfight</option>
      </select>
    </div>

    <div class="input-group">
      <label>ผู้ชนะ (Winner):</label>
      <select id="winnerSelect"></select>
    </div>

    <div class="input-group">
      <label>ผู้แพ้ (Loser):</label>
      <select id="loserSelect"></select>
    </div>

    <button type="submit" class="btn-submit">บันทึกผลการแข่งขัน</button>
  </form>
</div>

    <div id="history" class="page"><h2>📜 ประวัติการแข่ง</h2><div id="match-history"></div></div>
    <div id="score" class="page"><h2>📊 Leaderboard</h2><div id="leaderboard"></div></div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button onclick="showPage('home')">🏠<span>Home</span></button>
    <button onclick="showPage('members')">👥<span>สมาชิก</span></button>
    <button onclick="showPage('record')">⚔️<span>บันทึกผล</span></button>
    <button onclick="showPage('history')">📜<span>ประวัติ</span></button>
    <button onclick="showPage('score')">🏆<span>คะแนน</span></button>
  </nav>
</div>

    <!-- 3. วางโค้ดจากช่อง JS ใน CodePen ตรงนี้ (ต้องอยู่ล่างสุด) -->
    <script>
      const scriptURL = 'https://script.google.com/macros/s/AKfycbyjuVDHD5bsxPB1zHPkFo_le-vRpqa9RB6S7MvqoVaGHuWoDqtq7LdNLYnopmD6wBwwEQ/exec';

// 1. ฟังก์ชันหลักสำหรับโหลดข้อมูลมาแสดงผล
async function loadData() {
  try {
    const res = await fetch(scriptURL);
    const data = await res.json();
    
    const memberList = document.getElementById('member-list');
    const winSelect = document.getElementById('winnerSelect');
    const loseSelect = document.getElementById('loserSelect');
    
    if (memberList) {
      memberList.innerHTML = '';
      winSelect.innerHTML = '';
      loseSelect.innerHTML = '';
      
             data.members.forEach(m => {
        // อ้างอิง Index ตามรูป Sheet ที่ส่งมา
        const name = m[1];
        const grade = m[2];      // คอลัมน์ C (Index 2)
        const gameType = m[4];   // คอลัมน์ E (Index 4)
        const deckName = m[5];   // คอลัมน์ F (Index 5)
        const profileImg = m[6] || 'https://via.placeholder.com'; // คอลัมน์ G (Index 6)

        // เช็คสีตามเกม (Vanguard/Buddyfight)
        const gameClass = (gameType === 'Vanguard') ? 'card-vanguard' : 'card-buddy';
        const gameLabel = (gameType === 'Vanguard') ? 'VG' : 'BF';

        memberList.innerHTML += `
          <div class="member-card ${gameClass}">
            <img src="${profileImg}" style="width:65px;height:65px;border-radius:50%;object-fit:cover;">
            <b>${name}</b>
            <div style="font-size: 12px; margin-top: 5px;">
              <span style="color: #007bff; font-weight: bold;">[${grade}]</span> ${deckName}
            </div>
            <span class="badge">${gameLabel}</span>
          </div>`;
          
        let opt = `<option value="${name}">${name}</option>`;
        winSelect.innerHTML += opt;
        loseSelect.innerHTML += opt;
      });


    }

    updateLeaderboard(data.matches);
    updateHistory(data.matches);

  } catch (e) {
    console.error("Load Error:", e);
  }
}

// 2. ฟังก์ชันคำนวณตารางคะแนน (แยก Vanguard และ Buddyfight)
function updateLeaderboard(matches) {
  const scoreDiv = document.getElementById('leaderboard');
  if (!scoreDiv) return;
  
  let games = {
    "Vanguard": {},
    "Buddyfight": {}
  };

  matches.forEach(m => {
    const winner = m[1]; 
    const gameType = m[3]; 
    
    if (gameType && games[gameType]) {
      games[gameType][winner] = (games[gameType][winner] || 0) + 1;
    }
  });

  const createTable = (title, data) => {
    let sorted = Object.keys(data).sort((a, b) => data[b] - data[a]);
    let html = `<h3 style="margin-top:20px;">🎴 ${title}</h3>`;
    html += `<table border="1" style="width:100%; text-align:center; border-collapse: collapse;">
              <tr style="background:#eee;"><th>อันดับ</th><th>ชื่อ</th><th>ชนะ (ครั้ง)</th></tr>`;
    
    if (sorted.length === 0) {
      html += `<tr><td colspan="3">ยังไม่มีข้อมูลการแข่ง</td></tr>`;
    } else {
      sorted.forEach((name, index) => {
        html += `<tr><td>${index + 1}</td><td>${name}</td><td>${data[name]}</td></tr>`;
      });
    }
    return html + '</table>';
  };

  scoreDiv.innerHTML = createTable("Cardfight!! Vanguard", games["Vanguard"]) + 
                       createTable("Future Card Buddyfight", games["Buddyfight"]);
}

// 3. ฟังก์ชันแสดงประวัติการแข่งขัน (History)
function updateHistory(matches) {
  const historyDiv = document.getElementById('match-history');
  if (!historyDiv) return;
  
  let html = '';
  [...matches].reverse().forEach(m => {
    html += `<div style="border-bottom:1px solid #ccc; padding:10px;">
              <b>[${m[3]}]</b>: ${m[1]} 🏆 ชนะ ${m[2]} 
              <br><small>${new Date(m[0]).toLocaleString('th-TH')}</small>
            </div>`;
  });
  historyDiv.innerHTML = html || 'ยังไม่มีประวัติการแข่ง';
}

// 4. ฟังก์ชันส่งข้อมูล (แก้ไขเพื่อดับ Error 404/CORS ที่หน้าจอ)
async function sendToSheet(payload) {
  // ยิงข้อมูลไปโดยไม่รอเช็คสถานะ Error จาก Browser เพราะ no-cors จะฟ้อง Error เสมอ
  fetch(scriptURL, {
    method: 'POST',
    body: JSON.stringify(payload),
    mode: 'no-cors' 
  });

  // แจ้งเตือนผู้ใช้และรีโหลดหน้าจอทันที (ข้อมูลจะเข้า Google Sheets แน่นอนถ้า URL ถูก)
  alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
  setTimeout(() => {
    location.reload();
  }, 500); 
}

// --- Event Listeners ---

const regForm = document.getElementById('regForm');
if (regForm) {
  regForm.onsubmit = async (e) => {
    e.preventDefault();
    const userImg = await toBase64(document.getElementById('userImg').files[0]);
    const deckImg = await toBase64(document.getElementById('deckImg').files[0]);
    
    sendToSheet({
      type: 'register',
      name: document.getElementById('fname').value,
      grade: document.getElementById('grade').value,
      no: document.getElementById('no').value,
      game: document.getElementById('gameType').value,
      deck: document.getElementById('deckName').value,
      userPic: userImg,
      deckPic: deckImg
    });
  };
}

const matchForm = document.getElementById('matchForm');
if (matchForm) {
  matchForm.onsubmit = (e) => {
    e.preventDefault();
    const win = document.getElementById('winnerSelect').value;
    const lose = document.getElementById('loserSelect').value;
    const game = document.getElementById('matchGameType').value;

    if (win === lose) return alert("ผู้ชนะและผู้แพ้ซ้ำกัน!");

    sendToSheet({
      type: 'recordMatch',
      game: game,
      winner: win,
      loser: lose
    });
  };
}

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  loadData(); 
}

const toBase64 = file => new Promise((resolve) => {
  if (!file) return resolve("");
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = () => resolve(reader.result);
});

loadData();

    </script>
</body>
</html>
